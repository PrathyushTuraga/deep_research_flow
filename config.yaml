# Deep Research Flow Configuration

# LLM Configuration
llm:
  model: ollama/granite4
  base_url: http://localhost:11434
  temperature: 0.7

# Embeddings Configuration
embeddings:
  model: nomic-embed-text
  provider: ollama

# File Paths
paths:
  user_preference: knowledge/user_preference.txt
  output_report: research_report.md
  report_output_relative: ../research_report.md

# Flow Configuration
flow:
  tracing: true
  flow_id: our-deep-research-flow
  testing_mode: true

# Crew Configuration
crew:
  memory: true
  verbose: true
  process: sequential
  skip_task_evaluation: true # use true/false for strict evaluation of LLM output. Useful for small models

# Research Configuration
research:
  max_retries: 3
  timeout_seconds: 300

# UI Configuration
ui:
  colors:
    prompt: prompt-color
    reset: reset-color
  streamlit:
    page_title: Deep Research Flow
    page_icon: icon
    layout: wide