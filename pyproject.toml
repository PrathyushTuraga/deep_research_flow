[project]
name = "deep_research_flow"
version = "0.1.0"
description = "deep_research_flow using crewAI"
authors = [{ name = "Deep Research Flow Team", email = "contact@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.6.1",
    "litellm>=1.80.7",
    "matplotlib>=3.10.7",
    "ollama>=0.6.1",
    "pandas>=2.3.3",
    "qdrant-client>=1.16.1",
    "seaborn>=0.13.2",
]

[project.scripts]
kickoff = "deep_research_flow.main:kickoff"
run_crew = "deep_research_flow.main:kickoff"
plot = "deep_research_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"